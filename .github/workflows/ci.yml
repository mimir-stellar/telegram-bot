name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read


# CI is deterministic: no live RPC or Telegram calls. The poller's chain
# correctness against live data is verified separately with `npm run scan`.
#
# Node version matrix:
#   20 – minimum per package.json engines (">=20"), matches Dockerfile base image
#   22 – current LTS, used in production
#   24 – newest LTS, validates forward compatibility
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    name: Node ${{ matrix.node-version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
